services:
  e2e-phase1:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    command: ./phase1-clean-install.sh
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.claude.json:/root/.claude.json:ro
    environment:
      - GOOGLE_CLOUD_PROJECT=jhorn-pai
      - GOOGLE_CLOUD_LOCATION=us-east1
      - CLAUDE_CODE_USE_VERTEX=1
      - ANTHROPIC_VERTEX_PROJECT_ID=itpc-gcp-global-revenue-claude
      - VERTEX_PROJECT_ID=jhorn-pai
      - VERTEX_LOCATION=us-east1

  e2e-phase2:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    command: ./phase2-integration.sh
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.claude.json:/root/.claude.json:ro
      - ~/.claude/projects/-Users-jhorn--claude/memory:/real-data/memory:ro
      - ~/.claude/MEMORY/LEARNING/SIGNALS:/real-data/signals:ro
      - ~/.claude/MEMORY/LEARNING/RULES:/real-data/rules:ro
    environment:
      - GOOGLE_CLOUD_PROJECT=jhorn-pai
      - GOOGLE_CLOUD_LOCATION=us-east1
      - CLAUDE_CODE_USE_VERTEX=1
      - ANTHROPIC_VERTEX_PROJECT_ID=itpc-gcp-global-revenue-claude
      - VERTEX_PROJECT_ID=jhorn-pai
      - VERTEX_LOCATION=us-east1

  e2e-phase3b:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    command: ./phase3b-coexistence.sh
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.claude.json:/root/.claude.json:ro
    environment:
      - GOOGLE_CLOUD_PROJECT=jhorn-pai
      - GOOGLE_CLOUD_LOCATION=us-east1
      - CLAUDE_CODE_USE_VERTEX=1
      - ANTHROPIC_VERTEX_PROJECT_ID=itpc-gcp-global-revenue-claude
      - VERTEX_PROJECT_ID=jhorn-pai
      - VERTEX_LOCATION=us-east1

  e2e-phase4:
    build:
      context: ../..
      dockerfile: test/e2e/Dockerfile
    command: ./phase4-parity-gaps.sh
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro
      - ~/.claude.json:/root/.claude.json:ro
    environment:
      - GOOGLE_CLOUD_PROJECT=jhorn-pai
      - GOOGLE_CLOUD_LOCATION=us-east1
      - CLAUDE_CODE_USE_VERTEX=1
      - ANTHROPIC_VERTEX_PROJECT_ID=itpc-gcp-global-revenue-claude
      - VERTEX_PROJECT_ID=jhorn-pai
      - VERTEX_LOCATION=us-east1
