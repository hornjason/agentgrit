# Managed by rungate — do not edit. Customize via .claude/rungate.json ci section.
name: CI

on:
  push:
    branches:
      - **
  pull_request:
    branches:
      - **

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
