# Managed by rungate — do not edit. Customize the ci section of .claude/rungate/config.json.
#
# This job is deliberately unconditional. A job skipped by a condition reports
# `skipped`, which a required status check can be configured to accept, and
# that is a green check for a review that never ran. The credential check
# happens inside `run:` instead, and reports UNMEASURED when there is none.
#
# The second step says the same thing for the other door: a credential that
# resolved with no reviewer wired to use it (#631) has also not produced a
# review, and a check that stays quiet about that is the same defect.
name: AI Review

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  ai-review:
    runs-on: "ubuntu-latest"
    steps:
      - name: Detect AI review credentials
        id: ai-review-auth
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNGATE_REQUIRE_AI_REVIEW: ${{ vars.RUNGATE_REQUIRE_AI_REVIEW }}
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          #
          # Resolves exactly one of 4 modes: vertex, oauth, api-key, none.
          # The decision is here and not in an `if:` expression on purpose — `secrets`
          # is unavailable in `if:`, and a skipped step can satisfy a required check.
          set -uo pipefail

          mode=none
          if [ -n "${GCP_SA_KEY:-}" ]; then
            mode=vertex
          elif [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            mode=oauth
          elif [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            mode=api-key
          fi

          echo "ai-review auth mode: ${mode}"
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${mode}" != none ]; then
            exit 0
          fi

          echo "::warning title=AI review UNMEASURED::No Claude credential is configured (GCP_SA_KEY, CLAUDE_CODE_OAUTH_TOKEN, ANTHROPIC_API_KEY), so no AI review ran on this pull request. This check is UNMEASURED, not a passing review. Set the repository variable RUNGATE_REQUIRE_AI_REVIEW to 'true' to make an unmeasured review fail instead."

          if [ "${RUNGATE_REQUIRE_AI_REVIEW:-}" = "true" ]; then
            echo "::error title=AI review UNMEASURED::RUNGATE_REQUIRE_AI_REVIEW is 'true' and no credential is configured, so this pull request has no AI review. Failing rather than reporting a green check for a review that never happened." >&2
            exit 1
          fi

          exit 0
      - name: Authenticate to Vertex AI
        id: ai-review-vertex-auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ steps.ai-review-auth.outputs.mode == 'vertex' && secrets.GCP_SA_KEY || '' }}
      - name: Run the AI review
        id: ai-review-action
        continue-on-error: true
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ vars.ANTHROPIC_VERTEX_PROJECT_ID }}
          CLOUD_ML_REGION: ${{ vars.CLOUD_ML_REGION }}
        with:
          use_vertex: ${{ steps.ai-review-auth.outputs.mode == 'vertex' }}
          claude_code_oauth_token: ${{ steps.ai-review-auth.outputs.mode == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          anthropic_api_key: ${{ steps.ai-review-auth.outputs.mode == 'api-key' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_args: --model claude-opus-5-5 --allowedTools Read,Grep,Glob,Write
          prompt: |
            Review the changes on this branch for correctness defects: bugs that
            produce a wrong result, a crash, or data loss on some input you can name.
            Read the diff and the files around it before you conclude anything.

            Write the result to `ai-review-findings.json` in the workspace root, as a
            single JSON object shaped exactly like this:

            {
              "findings": [
                {
                  "severity": "one of: critical, high, medium, low, info",
                  "file": "repo-relative path",
                  "line": 1,
                  "summary": "one sentence stating the defect",
                  "failure_scenario": "concrete inputs or state, then the wrong output"
                }
              ],
              "verdict": "PASS or BLOCK"
            }

            Rules for the payload, each of which a later step enforces:

            - Severities critical, high block the pull request. Severities medium, low, info do not.
              A severity outside that list makes the whole review unreadable, so use no
              other word.
            - Found nothing: write an empty findings list and the verdict
              PASS. An empty payload is a result; a missing file is not.
            - Your verdict does not decide whether the run blocks. A later step computes
              that from the severities and refuses a verdict that disagrees with them, so
              a PASS over a blocking finding fails the job rather than
              passing it.
            - Write the file even if you can say nothing useful. A job with no payload has
              not passed a review, it has not had one.

            Do not post review comments, do not push commits, and do not edit any file in
            the tree other than the payload above.
      - name: Report whether the AI review ran
        id: ai-review-run
        env:
          AI_REVIEW_MODE: ${{ steps.ai-review-auth.outputs.mode }}
          AI_REVIEW_ACTION_OUTCOME: ${{ steps.ai-review-action.outcome }}
          RUNGATE_REQUIRE_AI_REVIEW: ${{ vars.RUNGATE_REQUIRE_AI_REVIEW }}
        run: |
          # Generated by rungate — lib/scaffold/ai-review-step.ts. Do not edit.
          #
          # Mode `none` has already annotated itself in the auth step. Annotating it
          # again here would report one state as two.
          set -uo pipefail

          if [ "${AI_REVIEW_MODE:-none}" = none ]; then
            exit 0
          fi

          if [ "${AI_REVIEW_ACTION_OUTCOME:-}" = success ]; then
            exit 0
          fi

          echo "::warning title=AI review UNMEASURED::The review action (#631) did not complete, so no AI review ran on this pull request and nothing was written to ai-review-findings.json. This check is UNMEASURED, not a passing review."

          if [ "${RUNGATE_REQUIRE_AI_REVIEW:-}" = "true" ]; then
            echo "::error title=AI review UNMEASURED::RUNGATE_REQUIRE_AI_REVIEW is 'true' and the review action (#631) did not complete, so this pull request has no AI review. Failing rather than reporting a green check for a review that never happened." >&2
            exit 1
          fi

          exit 0
