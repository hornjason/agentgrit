# Managed by rungate — do not edit. Customize the ci section of .claude/rungate/config.json.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the comparison base for the conformity ratchet
        run: |
          git fetch --no-tags --depth=200 origin '+refs/heads/main:refs/remotes/origin/main' \
            || echo "WARN: could not fetch main; the conformity allowlist growth check will report UNMEASURED."
      - uses: oven-sh/setup-bun@v2
        with:
          # From ci.bunVersion in .claude/rungate/config.json — this project declares no
          # .bun-version. Add one and re-scaffold to let CI read the declaration directly.
          bun-version: "latest"
      - run: bun install
      # No global tools installed: the config declares no ci.globalTools.
      - run: bun test
      - run: bun run typecheck
